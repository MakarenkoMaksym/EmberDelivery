name: CI

on:
    push:
        branches: ["master"]
    pull_request:
        branches: ["master"]
    workflow_dispatch:

jobs:
    build-and-test:
        name: Build & Test
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup .NET 10
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: "10.0.x"

            - name: Restore dependencies
              run: dotnet restore EmberDelivery.slnx

            - name: Build solution
              # Warnings are treated as errors via Directory.Build.props, so this guarantees clean code
              run: dotnet build EmberDelivery.slnx --configuration Release --no-restore

            - name: Run Tests (Unit & Architecture)
              # Integration tests will automatically run here too once we add them,
              # since ubuntu-latest has Docker daemon running by default for Testcontainers.
              run: dotnet test EmberDelivery.slnx --configuration Release --no-build
